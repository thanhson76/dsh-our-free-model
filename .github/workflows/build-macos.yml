name: build-macos

# Build the Our Free Model desktop shell .dmg on macOS (unsigned; Gatekeeper
# must be bypassed for local use).
# Triggered manually, or built automatically and uploaded as an artifact on v* tags.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # The desktop build stages the model workspace's engine binary, and
      # `scripts/prepare-desktop.mjs` refuses to package an installer without one
      # for the host platform. The repository only records `win32-x64` in
      # `vendor/magpie/engine.json`, so a macOS runner has to build its own —
      # without this step the bundle fails at `beforeBuildCommand` with
      # "the model workbench needs a darwin-arm64 engine binary". magpie's own go.mod pins
      # `go 1.26.8`, hence the floor here; `cache: false` because this repository
      # has no go.sum for setup-go to key a cache on.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install dependencies
        run: |
          npm install
          npm --prefix packages/standalone ci
          node scripts/build-standalone-ui.mjs
          npm --prefix packages/desktop ci --ignore-scripts
      - name: Build the model-workspace engine
        run: node scripts/build-magpie-engine.mjs
      - name: Build macOS dmg
        env:
          CI: true
        run: npm --prefix packages/desktop run build
      - name: Upload dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ofm-desktop-macos
          path: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Publish dmg as a release asset (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg=$(ls packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          version=$(node -p "require('./packages/desktop/package.json').version")
          arch=$(uname -m)
          release_tag="${GITHUB_REF_NAME}-macos-unofficial"
          cat > release-notes.md <<NOTES
          ## Unofficial community build

          This is NOT an official release by the repository author. The author restricted desktop installers to Windows-only since 2.4.0, leaving Mac users on 2.3.0. This dmg is built by GitHub Actions from public, auditable source.

          | Item | Value |
          |---|---|
          | Version | ${version} |
          | Arch | ${arch} |

          ### Trust

          1. Built from the public source for the current tag, auditable line by line.
          2. This dmg is the artifact of the very Actions run you are viewing, built on a GitHub macOS runner; anyone can fork and re-run the same workflow to reproduce it.
          3. After downloading, verify the SHA256 below.

          ### "Damaged" — how to open

          The package is unsigned / not notarized (a community build has no Apple Developer account), so Gatekeeper blocks first launch. The file is NOT damaged. Pick any one:

          1. In Finder, Control-click the app → Open → confirm again.
          2. Remove the quarantine attribute in Terminal:

          ```bash
          xattr -cr /Applications/Our\ Free\ Model.app
          ```

          3. If it still complains, use sudo:

          ```bash
          sudo xattr -rd com.apple.quarantine '/Applications/Our Free Model.app'
          ```

          4. System Settings → Privacy & Security → Open Anyway.

          NOTES
          {
            echo ""
            echo "---"
            echo "- Source: ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- SHA256: $sha"
          } >> release-notes.md
          gh release create "$release_tag" "$dmg" \
            --title "${version} macOS (${arch}) — unofficial community build" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" || gh release upload "$release_tag" "$dmg" --clobber
