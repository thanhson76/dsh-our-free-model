# dsh-our-free-model bundle patch.
#
# A single insert line mounts the host half; the browser half is declared by
# dsh.client in package.json and is bound to this line, whose name is the bare
# package name (subpath lines do not carry the half).
- insert:
    - id: our-free-model
      name: 'dsh-our-free-model'
      config: {}
